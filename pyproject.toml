[project]
name = "nebus-payments"
version = "0.1.0"
description = "Асинхронная обработка платежей и доставка webhook"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "faststream[rabbit]==0.7.7",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "mypy==1.19.1",
    "ruff==0.15.2",
    "import-linter==2.9",
    "pre-commit==4.6.2",
    "commitizen==4.19.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: требует настоящих PostgreSQL и RabbitMQ"]
filterwarnings = ["error", "ignore::DeprecationWarning:faststream.*"]

[tool.ruff]
line-length = 88
required-version = ">=0.14.3"
src = [
  "app",
]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
  "FAST",
  "ANN",
  "ASYNC",
  "I",
  "F",
  "S",
  "BLE",
  "FBT",
  "B",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "EM",
  "ISC",
  "ICN",
  "LOG",
  "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "SLOT",
  "TC",
  "TID",
  "ARG",
  "PTH",
  "FLY",
  "C90",
  "PD",
  "N",
  "PERF",
  "E",
  "W",
  "D",
  "PGH",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "UP",
  "FURB",
  "TRY",
  "RUF",
]
ignore = [
  "COM812", # конфликтует с ruff-format
  "S101", # assert в тестах и инвариантах
  "RUF001",
  "RUF002",
  "RUF003",
  "TC006",
  "D104",
  "D415",
  "D400",
  "D203",
  "D212",
  "E402",
  "D202",
  "D205",
  "SIM210",
  "FBT001",
  "E501",
  "D401",
  "TRY300",
  "INP001",
  "B008",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.mccabe]
max-complexity = 3

[tool.ruff.lint.pylint]
max-returns = 4
max-branches = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR2004", "SLF001", "S608", "S105", "S106"]
"migrations/**" = ["PLR0915"]
"scripts/**" = ["T201", "S310"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.commitizen]
name = "cz_conventional_commits"
version_files = ["pyproject.toml:^version"]
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
