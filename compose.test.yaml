# Отдельный проект и тома; production/development база здесь не используется.
services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: payments_test
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1.4-management
    hostname: rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: .
      target: development
    environment:
      TEST: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments_test
      TEST_RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "pytest",
        "tests",
        "-q",
        "--cov=app",
        "--cov-report=term-missing",
      ]
